apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: 472864302807.dkr.ecr.us-east-1.amazonaws.com/backend:055e539
          ports:
            - containerPort: 8080