apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  annotations:
    demo.argocd/change: "test-1"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: public.ecr.aws/m1e5l6p3/frontend:34d239e
          ports:
            - containerPort: 80
