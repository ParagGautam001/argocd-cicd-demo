apiVersion: apps/v1
kind: Deployment

metadata:
  name: frontend
  namespace: frontend-ns

spec:
  replicas: 2

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      containers:
        - name: frontend
          image: public.ecr.aws/m1e5l6p3/frontend:af36e0a
          ports:
            - containerPort: 80