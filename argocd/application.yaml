apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: my-cicd-demo
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/ParagGautam001/argocd-cicd-demo.git
    targetRevision: main
    path: k8s

  destination:
    server: https://kubernetes.default.svc

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
