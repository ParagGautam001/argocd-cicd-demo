version: 0.2

env:
  variables:
    AWS_REGION: "us-east-1"
    AWS_ACCOUNT_ID: "472864302807"
    BACKEND_REPO: "backend"
    FRONTEND_REPO: "frontend"

phases:
  pre_build:
    commands:
      - echo "Logging in to Amazon ECR..."
      - aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com

      - echo "Setting image URI..."
      - BACKEND_IMAGE=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$BACKEND_REPO
      - FRONTEND_IMAGE=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$FRONTEND_REPO

      - IMAGE_TAG="v1.0.$CODEBUILD_BUILD_NUMBER"

      - 'echo "Backend image: $BACKEND_IMAGE:$IMAGE_TAG"'
      - 'echo "Frontend image: $FRONTEND_IMAGE:$IMAGE_TAG"'

  build:
    commands:
      - echo "Build started on `date`"

      - echo "Building backend image..."
      - docker build -t "$BACKEND_IMAGE:$IMAGE_TAG" ./backend

      - echo "Building frontend image..."
      - docker build -t "$FRONTEND_IMAGE:$IMAGE_TAG" ./frontend

  post_build:
    commands:
      - echo "Pushing backend image..."
      - docker push "$BACKEND_IMAGE:$IMAGE_TAG"

      - echo "Pushing frontend image..."
      - docker push "$FRONTEND_IMAGE:$IMAGE_TAG"

      - echo "Creating image definitions..."
      - printf '[{"name":"backend","imageUri":"%s"}]' "$BACKEND_IMAGE:$IMAGE_TAG" > backend-image.json
      - printf '[{"name":"frontend","imageUri":"%s"}]' "$FRONTEND_IMAGE:$IMAGE_TAG" > frontend-image.json

      - echo "Updating Kubernetes manifests with image tag..."
      - sed -i "s|\$IMAGE_TAG|$IMAGE_TAG|g" k8s/backend-deployment.yaml
      - sed -i "s|\$IMAGE_TAG|$IMAGE_TAG|g" k8s/frontend-deployment.yaml

      - echo "Backend deployment image:"
      - grep "image:" k8s/backend-deployment.yaml

      - echo "Frontend deployment image:"
      - grep "image:" k8s/frontend-deployment.yaml

      - echo "Build completed on `date`"

artifacts:
  files:
    - backend-image.json
    - frontend-image.json
    - deploy-buildspec.yml
    - k8s/**/*