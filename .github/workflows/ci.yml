name: CI-CD

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: write

env:
  AWS_REGION: us-east-1

  BACKEND_ECR:
    472864302807.dkr.ecr.us-east-1.amazonaws.com/backend

  FRONTEND_ECR:
    public.ecr.aws/m1e5l6p3/frontend

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout source code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Configure AWS using GitHub OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::472864302807:role/github-actions-ecr-role
          aws-region: ${{ env.AWS_REGION }}

      # 3. Login to Private ECR
      - name: Login to Private ECR
        uses: aws-actions/amazon-ecr-login@v2

      # 4. Login to Public ECR
      - name: Login to Public ECR
        run: |
          aws ecr-public get-login-password --region us-east-1 | \
          docker login --username AWS --password-stdin public.ecr.aws

      # 5. Create dynamic image tag
      - name: Set image tag
        run: |
          echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

      # 6. Build frontend
      - name: Build frontend image
        run: |
          docker build \
            -t ${{ env.FRONTEND_ECR }}:${IMAGE_TAG} \
            ./frontend

      # 7. Push frontend to Public ECR
      - name: Push frontend image
        run: |
          docker push ${{ env.FRONTEND_ECR }}:${IMAGE_TAG}

      # 8. Build backend
      - name: Build backend image
        run: |
          docker build \
            -t ${{ env.BACKEND_ECR }}:${IMAGE_TAG} \
            ./backend

      # 9. Push backend to Private ECR
      - name: Push backend image
        run: |
          docker push ${{ env.BACKEND_ECR }}:${IMAGE_TAG}

      # 10. Update Kubernetes manifests
      - name: Update image tags
        run: |
          sed -i "s|image: .*backend:.*|image: ${{ env.BACKEND_ECR }}:${IMAGE_TAG}|g" k8s/backend-deployment.yaml

          sed -i "s|image: .*frontend:.*|image: ${{ env.FRONTEND_ECR }}:${IMAGE_TAG}|g" k8s/frontend-deployment.yaml

      # 11. Commit manifest changes
      - name: Commit Kubernetes manifests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add k8s/
          git commit -m "Update images to ${IMAGE_TAG}" || echo "No changes to commit"
          git push
